[project]
name = "smart-parking-ai-training"
version = "0.1.0"
description = "Offline training pipelines for smart parking detectors"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "typer==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
parking-training = "smart_parking_training.cli:app"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.6",
  "mypy==2.3.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/smart_parking_training"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
