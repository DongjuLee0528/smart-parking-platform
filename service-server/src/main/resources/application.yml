spring:
  application:
    name: smart-parking-service
  datasource:
    url: ${SERVICE_DATABASE_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${SERVICE_DATABASE_USERNAME:smart_parking}
    password: ${SERVICE_DATABASE_PASSWORD:smart_parking_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVICE_SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
