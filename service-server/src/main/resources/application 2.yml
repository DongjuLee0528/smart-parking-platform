spring:
  application:
    name: smart-parking-service
  datasource:
    url: ${SERVICE_DATABASE_URL:jdbc:mysql://localhost:3306/smart_parking}
    username: ${SERVICE_DATABASE_USERNAME:smart_parking}
    password: ${SERVICE_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVICE_SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
